name: Deploy Laravel kasio (Vite + SSL)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Composer install
        run: composer install --no-dev --optimize-autoloader
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install NPM & Build Vite
        run: |
          npm ci
          npm run build
          
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kasio'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_KASIO }}
          package: .
