name: Build and deploy Laravel to Azure Web App - kasio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Install Composer Dependencies
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-suggest --no-interaction --no-dev --optimize-autoloader

      - name: Zip The Application Files
        run: zip -r release.zip ./* -x "*.git*" "node_modules/*" "tests/*"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: 'Extract artifact'
        run: unzip release.zip
      
      - name: 'Configure App Settings'
        uses: azure/appservice-settings@v1
        with:
          app-name: 'kasio'
          slot-name: 'Production'
          app-settings-json: '[
            {"name": "MIDTRANS_MERCHANT_ID", "value": "${{ secrets.MIDTRANS_MERCHANT_ID }}", "slotSetting": false},
            {"name": "MIDTRANS_CLIENT_KEY", "value": "${{ secrets.MIDTRANS_CLIENT_KEY }}", "slotSetting": false},
            {"name": "MIDTRANS_SERVER_KEY", "value": "${{ secrets.MIDTRANS_SERVER_KEY }}", "slotSetting": false},
            {"name": "MYSQL_ATTR_SSL_KEY", "value": "${{ secrets.MYSQL_ATTR_SSL_KEY }}", "slotSetting": false},
            {"name": "GOOGLE_CLIENT_ID", "value": "${{ secrets.GOOGLE_CLIENT_ID }}", "slotSetting": false},
            {"name": "GOOGLE_CLIENT_SECRET", "value": "${{ secrets.GOOGLE_CLIENT_SECRET }}", "slotSetting": false},
            {"name": "APP_ENV", "value": "production", "slotSetting": false},
            {"name": "APP_DEBUG", "value": "false", "slotSetting": false},
            {"name": "APP_URL", "value": "https://kasio.azurewebsites.net", "slotSetting": false}
          ]'

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kasio'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_KASIO }}
          package: .
